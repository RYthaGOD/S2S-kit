[package]
name = "stake_to_subscribe"
version = "0.2.0"
description = "S2S-Kit — non-custodial staking-yield routing on Solana"
edition = "2021"
license-file = "../../../LICENSE"

[lib]
crate-type = ["cdylib", "lib"]
name = "stake_to_subscribe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "associated_token", "metadata"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
